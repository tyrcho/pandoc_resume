name: Deploy resume

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/deploy.yml"
      - "Makefile"
      - "CNAME"
      - "css/**"
      - "index.html"
      - "resume.md"
      - "scripts/**"
      - "templates/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc python3-yaml texlive-xetex
          python3 -m pip install ruff

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      - name: Build site
        run: make all PDF_ENGINE=xelatex

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
